<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dionísio - Deus do Vinho</title>
    <link rel="stylesheet" href="../css/dionisio.css">
</head>

<body class="dionisio-theme">
    <section class="theater-stage">
        <div class="curtain">
            <h1>Dionísio</h1>
            <p class="epithet">O Patrono do Teatro e do Vinho</p>
        </div>
        <img src="https://static.wikia.nocookie.net/rpg-rise-of-the-titans/images/e/ea/Dioniso.png/revision/latest?cb=20200720185003&path-prefix=pt-br"
            alt="Dionísio" class="wine-img">
        <div class="festivity">
            <p>Celebração, êxtase, festas e a colheita da uva. Onde Dionísio está, a alegria (e o caos) governam.</p>
        </div>
        <a href="../index.html" class="wine-btn">← Fim do Ato (Voltar)</a>
    </section>
    <button class="btn-modal" onclick="document.getElementById('modal-dionisio').showModal()">O Cálice</button>
    <dialog id="modal-dionisio" class="modal-box">
        <h2>O Tirso</h2>
        <p>Um bastão envolto em heras, símbolo de prosperidade e loucura divina.</p>
        <button onclick="this.closest('dialog').close()">Brindar e Fechar</button>
    </dialog>
    <footer class="partner-footer">
        <p>Servido por: [Seu Nome]</p>
    </footer>
</body>
</html>
